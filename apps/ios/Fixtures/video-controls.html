<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Webpage video controls</title>
<h1>Webpage video controls</h1>
<video id="video" controls preload="metadata" src="/sample.mp4" width="280"></video>
<p><button onclick="document.getElementById('video').play()">Play in page</button></p>
<p><button onclick="document.getElementById('video').webkitEnterFullscreen()">Fullscreen in page</button></p>
</html>
