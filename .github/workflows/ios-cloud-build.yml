name: iOS cloud build

# zero red 云编译：在 GitHub 托管的 macOS 运行器上解析工程、跑核心测试、编译模拟器 Release、
# 打包未签名真机 IPA，并把产物写入同一个仓库的 Release（标签 build-<运行ID>-<尝试>）。
# 只手动触发：交付脚本按当前提交的完整 SHA 触发，保证交付的源码与构建一致。

on:
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: 运行 Swift 核心单元测试（离线，54 项）
        type: boolean
        default: true
      run_ui_tests:
        description: 运行 iOS 模拟器界面测试（托管运行器上媒体相关用例可能不稳定）
        type: boolean
        default: false
      ui_test_only:
        description: 只跑界面测试里的指定用例（空格分隔，例如 testDesignScreenshots）
        type: string
        default: ''
      build_simulator_release:
        description: 编译模拟器 Release 并做静态分析
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-cloud-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare tools
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version

      - name: Choose simulator
        if: ${{ inputs.run_ui_tests }}
        id: simulator
        run: |
          set -euo pipefail
          # 只挑设备，不在这里启动：xcodebuild 会自己把目标模拟器启动好，
          # 显式 simctl boot + bootstatus 在托管运行器上可能长时间不返回。
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          device=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          choices = [(runtime, device) for runtime, items in devices.items() if "iOS" in runtime for device in items if device.get("isAvailable") and "iPhone" in device["name"]]
          if not choices:
              raise SystemExit("没有可用的 iPhone 模拟器")
          choices.sort(key=lambda item: item[0], reverse=True)
          print(choices[0][1]["udid"])
          PY
          )
          echo "id=$device" >> "$GITHUB_OUTPUT"
          echo "使用模拟器 $device"
          xcrun simctl list runtimes | tail -5

      - name: Run core tests
        if: ${{ inputs.run_unit_tests }}
        env:
          ZERO_RED_TEST_CACHE: ${{ runner.temp }}/zero-red-test-cache
        run: bash apps/ios/scripts/test-core.sh

      - name: Run UI tests
        if: ${{ inputs.run_ui_tests }}
        continue-on-error: true
        env:
          IOS_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
          ZERO_RED_IOS_RESULTS: ${{ github.workspace }}/build/ui-tests
          ONLY_TESTING: ${{ inputs.ui_test_only }}
        run: bash apps/ios/scripts/test-ios.sh

      - name: Export UI screenshots
        if: ${{ always() && inputs.run_ui_tests }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          results=(build/ui-tests/*.xcresult)
          if [ ${#results[@]} -eq 0 ]; then echo '没有 xcresult，跳过截图导出。'; exit 0; fi
          mkdir -p build/ui-screens
          for result in "${results[@]}"; do
            xcrun xcresulttool export attachments --path "$result" --output-path build/ui-screens || echo '截图导出失败，仅影响视觉证据，不影响安装包。'
          done
          find build/ui-screens -type f | head -50

      - name: Build simulator Release
        if: ${{ inputs.build_simulator_release }}
        run: bash scripts/cloud-release.sh

      - name: Build unsigned device IPA
        id: ipa
        run: bash scripts/package-ipa.sh

      - name: Record source and toolchain
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          { printf 'commit=%s\nrun_id=%s\nrun_attempt=%s\n' "$SOURCE_SHA" "$RUN_ID" "$RUN_ATTEMPT"; xcodebuild -version; } > build/ipa/build-source.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload build artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ZeroRed-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ipa
            build/simulator-release.log
            build/ui-tests/*.log
            build/ui-tests/*.txt
            build/ui-tests/*.xcresult
            build/ui-screens
          if-no-files-found: warn
          retention-days: 30

      - name: Publish build release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_OUTCOME: ${{ steps.ipa.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          assets=()
          if [[ "$IPA_OUTCOME" == success ]] && compgen -G 'build/ipa/*.ipa' >/dev/null; then
            /usr/bin/ditto -c -k --keepParent build/ipa "$RUNNER_TEMP/ZeroRed-ipa.zip"
            assets+=("$RUNNER_TEMP/ZeroRed-ipa.zip")
          fi
          logs="$RUNNER_TEMP/zero-red-logs"
          mkdir -p "$logs"
          cp build/ipa/*.log "$logs"/ 2>/dev/null || true
          cp build/simulator-release.log "$logs"/ 2>/dev/null || true
          # 只收日志与 xcresult：DerivedData 会把日志包撑到几百 MB。
          if [[ -d build/ui-tests ]]; then
            mkdir -p "$logs/ui-tests"
            for item in build/ui-tests/*.log build/ui-tests/*.txt build/ui-tests/*.xcresult; do
              if [[ -e "$item" ]]; then cp -R "$item" "$logs/ui-tests"/; fi
            done
          fi
          if [[ -d build/ui-screens ]]; then cp -R build/ui-screens/. "$logs"/ui-screens; fi
          /usr/bin/ditto -c -k --keepParent "$logs" "$RUNNER_TEMP/ZeroRed-build-logs.zip"
          assets+=("$RUNNER_TEMP/ZeroRed-build-logs.zip")
          if [[ "$IPA_OUTCOME" == success ]]; then
            notes="源码提交 ${SOURCE_SHA}。IPA 为未签名包，需要用 Sideloadly 在本机签名后安装。"
          else
            notes="源码提交 ${SOURCE_SHA}。真机 IPA 构建未成功，请查看运行日志与本 Release 中的构建日志。"
          fi
          publish() {
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --target "$SOURCE_SHA" --draft \
                --title "zero red 云构建 ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --notes "$notes" || return 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber &&
              gh release edit "$tag" --draft=false
          }
          for attempt in 1 2; do
            if publish >"$RUNNER_TEMP/publish.log" 2>&1; then exit 0; fi
            cat "$RUNNER_TEMP/publish.log"
            if [[ "$attempt" == 1 ]]; then echo '发布产物失败，5 秒后重试一次。'; sleep 5; fi
          done
          echo '发布产物失败：检查仓库 Actions 的 contents: write 权限。'
          exit 1