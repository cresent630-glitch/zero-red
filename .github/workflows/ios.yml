name: iOS validation
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Core and HTTP download tests
        run: bash scripts/test-core.sh
      - name: Choose an installed iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available -j > /tmp/zero-red-simulators.json
          python3 - <<'PY'
          import json,os
          data=json.load(open('/tmp/zero-red-simulators.json'))
          choices=[device for runtime,devices in data['devices'].items() if 'iOS' in runtime for device in devices if device['isAvailable'] and 'iPhone' in device['name']]
          if not choices: raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('IOS_SIMULATOR_ID='+choices[0]['udid']+'\n')
          PY
      - name: Build, UI tests, Release build and analysis
        run: bash scripts/test-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: apps/ios/TestResults
